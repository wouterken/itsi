name: Native Gem Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional prerelease version. Leave blank to derive it from the branch name."
        required: false
        type: string
      reuse_run_id:
        description: "Optional prior workflow run ID to reuse compiled native gem artifacts from."
        required: false
        type: string
      gem_scope:
        description: "Which native gem(s) to build."
        required: true
        type: choice
        default: all
        options:
          - all
          - server
          - scheduler
      platform_scope:
        description: "Which platform(s) to build."
        required: true
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x86_64
          - linux-x86_64
          - linux-arm64
      ruby_scope:
        description: "Ruby coverage for smoke tests."
        required: true
        type: choice
        default: full
        options:
          - full
          - single
      ruby_version:
        description: "Ruby version to use when ruby_scope=single."
        required: true
        type: choice
        default: "3.4"
        options:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"

env:
  CIBUILDGEM: "1"
  CIBUILDGEM_VERSION: "0.2.1"
  BUNDLE_RETRY: "8"
  BUNDLE_TIMEOUT: "30"

jobs:
  resolve-matrix:
    name: Resolve workflow filters
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.resolve.outputs.entries }}
      compile_ruby_cc_versions: ${{ steps.resolve.outputs.compile_ruby_cc_versions }}
      smoke_rubies: ${{ steps.resolve.outputs.smoke_rubies }}
    steps:
      - name: Resolve selected matrix entries
        id: resolve
        env:
          GEM_SCOPE: ${{ inputs.gem_scope }}
          PLATFORM_SCOPE: ${{ inputs.platform_scope }}
          RUBY_SCOPE: ${{ inputs.ruby_scope }}
          RUBY_VERSION: ${{ inputs.ruby_version }}
        run: |
          ruby <<'RUBY' >> "${GITHUB_OUTPUT}"
          require "json"

          entries = [
            { gem_id: "server", gem_name: "itsi-server", gem_dir: "gems/server", gemfile: "gems/server/Gemfile", smoke_script: "script/ci/smoke_server.rb", require_path: "itsi/server", platform_id: "linux-x86_64", platform_name: "Linux x86_64", runner: "ubuntu-22.04" },
            { gem_id: "server", gem_name: "itsi-server", gem_dir: "gems/server", gemfile: "gems/server/Gemfile", smoke_script: "script/ci/smoke_server.rb", require_path: "itsi/server", platform_id: "linux-arm64", platform_name: "Linux arm64", runner: "ubuntu-22.04-arm" },
            { gem_id: "server", gem_name: "itsi-server", gem_dir: "gems/server", gemfile: "gems/server/Gemfile", smoke_script: "script/ci/smoke_server.rb", require_path: "itsi/server", platform_id: "macos-x86_64", platform_name: "macOS x86_64", runner: "macos-15-intel" },
            { gem_id: "server", gem_name: "itsi-server", gem_dir: "gems/server", gemfile: "gems/server/Gemfile", smoke_script: "script/ci/smoke_server.rb", require_path: "itsi/server", platform_id: "macos-arm64", platform_name: "macOS arm64", runner: "macos-latest" },
            { gem_id: "scheduler", gem_name: "itsi-scheduler", gem_dir: "gems/scheduler", gemfile: "gems/scheduler/Gemfile", smoke_script: "script/ci/smoke_scheduler.rb", require_path: "itsi/scheduler", platform_id: "linux-x86_64", platform_name: "Linux x86_64", runner: "ubuntu-22.04" },
            { gem_id: "scheduler", gem_name: "itsi-scheduler", gem_dir: "gems/scheduler", gemfile: "gems/scheduler/Gemfile", smoke_script: "script/ci/smoke_scheduler.rb", require_path: "itsi/scheduler", platform_id: "linux-arm64", platform_name: "Linux arm64", runner: "ubuntu-22.04-arm" },
            { gem_id: "scheduler", gem_name: "itsi-scheduler", gem_dir: "gems/scheduler", gemfile: "gems/scheduler/Gemfile", smoke_script: "script/ci/smoke_scheduler.rb", require_path: "itsi/scheduler", platform_id: "macos-x86_64", platform_name: "macOS x86_64", runner: "macos-15-intel" },
            { gem_id: "scheduler", gem_name: "itsi-scheduler", gem_dir: "gems/scheduler", gemfile: "gems/scheduler/Gemfile", smoke_script: "script/ci/smoke_scheduler.rb", require_path: "itsi/scheduler", platform_id: "macos-arm64", platform_name: "macOS arm64", runner: "macos-latest" }
          ]

          gem_scope = ENV.fetch("GEM_SCOPE")
          platform_scope = ENV.fetch("PLATFORM_SCOPE")
          ruby_scope = ENV.fetch("RUBY_SCOPE")
          ruby_version = ENV.fetch("RUBY_VERSION")

          filtered = entries.select do |entry|
            (gem_scope == "all" || entry[:gem_id] == gem_scope) &&
              (platform_scope == "all" || entry[:platform_id] == platform_scope)
          end

          raise "No matrix entries match the selected filters" if filtered.empty?

          compile_ruby_cc_versions_by_minor = {
            "3.1" => "3.1.6",
            "3.2" => "3.2.9",
            "3.3" => "3.3.9",
            "3.4" => "3.4.6",
            "4.0" => "4.0.0"
          }

          compile_ruby_cc_versions =
            if ruby_scope == "single"
              [compile_ruby_cc_versions_by_minor.fetch(ruby_version)]
            else
              compile_ruby_cc_versions_by_minor.values
            end

          smoke_rubies =
            if ruby_scope == "single"
              [ruby_version]
            else
              %w[3.1 3.4 4.0]
            end

          puts "entries=#{JSON.generate(filtered)}"
          puts "compile_ruby_cc_versions=#{JSON.generate(compile_ruby_cc_versions)}"
          puts "smoke_rubies=#{JSON.generate(smoke_rubies)}"
          RUBY

  resolve-version:
    name: Resolve build version
    needs: resolve-matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Resolve version
        id: resolve
        run: |
          version="$(ruby script/ci/resolve_version.rb "${{ inputs.version }}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building ${version}"

  native-compile:
    name: Compile ${{ matrix.gem_name }} on ${{ matrix.platform_name }}
    needs:
      - resolve-matrix
      - resolve-version
    outputs:
      artifact_run_id: ${{ steps.artifact-source.outputs.run_id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.entries) }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      BUNDLE_WITHOUT: server_test:server_test_support
    steps:
      - name: Resolve artifact source run
        id: artifact-source
        run: |
          if [ -n "${{ inputs.reuse_run_id }}" ]; then
            echo "run_id=${{ inputs.reuse_run_id }}" >> "${GITHUB_OUTPUT}"
          else
            echo "run_id=${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout code
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/checkout@v5

      - name: Set up Ruby
        if: ${{ inputs.reuse_run_id == '' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.7"
          bundler: "2.6.9"
          bundler-cache: true

      - name: Set up Rust
        if: ${{ inputs.reuse_run_id == '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Set CI version
        if: ${{ inputs.reuse_run_id == '' }}
        run: ruby script/ci/set_version.rb "${{ needs.resolve-version.outputs.version }}"

      - name: Select cross-compile Ruby ABIs
        if: ${{ inputs.reuse_run_id == '' }}
        run: |
          ruby_cc_versions='${{ needs.resolve-matrix.outputs.compile_ruby_cc_versions }}'
          ruby_cc_version="$(ruby -rjson -e "puts JSON.parse(ARGV.fetch(0)).join(':')" "${ruby_cc_versions}")"
          echo "RUBY_CC_VERSION=${ruby_cc_version}" >> "${GITHUB_ENV}"
          echo "Compiling native gem for Ruby ABIs: ${ruby_cc_version}"

      - name: Install Linux build dependencies
        if: ${{ inputs.reuse_run_id == '' && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config

      - name: Install macOS build dependencies
        if: ${{ inputs.reuse_run_id == '' && runner.os == 'macOS' }}
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "${GITHUB_ENV}"
          echo "$(brew --prefix llvm)/bin" >> "${GITHUB_PATH}"

      - name: Install Ruby dependencies
        if: ${{ inputs.reuse_run_id == '' }}
        run: bundle install

      - name: Sync Rust crates into gem ext directories
        if: ${{ inputs.reuse_run_id == '' }}
        run: bundle exec rake sync_crates

      - name: Install cibuildgem
        if: ${{ inputs.reuse_run_id == '' }}
        run: gem install cibuildgem -v "${CIBUILDGEM_VERSION}"

      - name: Prepare rake-compiler Ruby configs
        if: ${{ inputs.reuse_run_id == '' }}
        run: bash script/ci/setup_cibuildgem_rake_compiler.sh "${{ matrix.gem_dir }}"

      - name: Package native gem
        if: ${{ inputs.reuse_run_id == '' }}
        working-directory: ${{ matrix.gem_dir }}
        run: cibuildgem package

      - name: Upload native gems
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-gems-${{ matrix.gem_id }}-${{ matrix.platform_id }}
          path: ${{ matrix.gem_dir }}/pkg/*.gem
          if-no-files-found: error
          retention-days: 7

  native-test-cross:
    name: Cross-test ${{ matrix.entry.gem_name }} on ${{ matrix.entry.platform_name }} with Ruby ${{ matrix.ruby }}
    needs:
      - resolve-matrix
      - resolve-version
      - native-compile
    runs-on: ${{ matrix.entry.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve-matrix.outputs.entries) }}
        ruby: ${{ fromJson(needs.resolve-matrix.outputs.smoke_rubies) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Download packaged gems
        uses: actions/download-artifact@v5
        with:
          name: native-gems-${{ matrix.entry.gem_id }}-${{ matrix.entry.platform_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/downloaded-gems
          run-id: ${{ needs.native-compile.outputs.artifact_run_id }}

      - name: Install native gem
        run: |
          native_gem="$(find "${RUNNER_TEMP}/downloaded-gems" -maxdepth 1 -type f \
            -name "${{ matrix.entry.gem_name }}-${{ needs.resolve-version.outputs.version }}-*.gem" \
            ! -name "${{ matrix.entry.gem_name }}-${{ needs.resolve-version.outputs.version }}.gem" \
            -print -quit)"

          if [ -z "${native_gem}" ]; then
            echo "Could not find packaged native gem artifact" >&2
            find "${RUNNER_TEMP}/downloaded-gems" -maxdepth 1 -type f -name '*.gem' | sort >&2
            exit 1
          fi

          gem install --no-document "${native_gem}"

      - name: Run installed gem smoke test
        run: ruby "${{ matrix.entry.smoke_script }}"

  wrapper-gem:
    name: Build wrapper gem
    needs:
      - resolve-version
      - native-test-cross
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Set CI version
        run: ruby script/ci/set_version.rb "${{ needs.resolve-version.outputs.version }}"

      - name: Build wrapper gem
        run: |
          mkdir -p pkg
          gem build itsi.gemspec --output "pkg/itsi-${{ needs.resolve-version.outputs.version }}.gem"

      - name: Upload wrapper gem
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-gem-${{ needs.resolve-version.outputs.version }}
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 7

  bundle-artifacts:
    name: Bundle all gem artifacts
    needs:
      - resolve-version
      - native-compile
      - native-test-cross
      - wrapper-gem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download native gems
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          pattern: native-gems-*
          path: artifacts/native
          run-id: ${{ needs.native-compile.outputs.artifact_run_id }}

      - name: Download wrapper gem
        uses: actions/download-artifact@v5
        with:
          name: wrapper-gem-${{ needs.resolve-version.outputs.version }}
          path: artifacts/wrapper

      - name: Collect gem files
        run: |
          mkdir -p artifacts/final
          find artifacts/native -maxdepth 2 -name '*.gem' -exec cp {} artifacts/final/ \;
          find artifacts/wrapper -maxdepth 1 -name '*.gem' -exec cp {} artifacts/final/ \;
          ls -1 artifacts/final > "artifacts/final/manifest-${{ needs.resolve-version.outputs.version }}.txt"

      - name: Upload bundled gems
        uses: actions/upload-artifact@v4
        with:
          name: itsi-gems-${{ needs.resolve-version.outputs.version }}
          path: artifacts/final/*
          if-no-files-found: error
          retention-days: 7
